<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>El Bingo de Luca - Edición Quiniela</title>
  <style>
    :root {
      --primary-color: #2c3e50;
      --secondary-color: #27ae60;
      --accent-color: #3498db;
      --highlight-color: #f39c12;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-image: url('LucaFutbol.jpg'); 
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      padding: 20px;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(255, 255, 255, 0.92);
      z-index: -1;
    }

    .main-container {
      display: grid;
      grid-template-columns: 1fr 1.5fr;
      gap: 30px;
      width: 100%;
      max-width: 1100px;
    }

    /* Panel Izquierdo: Número y Significado */
    .control-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      text-align: center;
    }

    #numero-grande {
      font-size: 160px;
      font-weight: 900;
      color: var(--accent-color);
      line-height: 1;
      margin: 10px 0;
    }

    #significado-texto {
      font-size: 2.5rem;
      font-weight: bold;
      color: var(--highlight-color);
      min-height: 3.5rem;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    /* Tablero Derecho */
    .board-panel {
      background: white;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    .grilla-bingo {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 5px;
    }

    .celda {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #eee;
      border-radius: 8px;
      font-weight: bold;
      color: #ddd;
      font-size: 1rem;
    }

    .celda.marcada {
      background-color: var(--secondary-color);
      color: white;
      transform: scale(1.05);
    }

    .button-group {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    button {
      flex: 1;
      padding: 18px;
      font-size: 1.2rem;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.2s;
    }

    #btnSiguiente { background: var(--secondary-color); color: white; }
