<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>El Bingo de Luca</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-image: url('LucaFutbol.jpg'); /* ⚠️ Asegúrate de tener esta imagen en la misma carpeta */
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
      color: #fff;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.7);
    }

    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(255, 255, 255, 0.85);
      z-index: -1;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 10px;
      color: #2c3e50;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }

    .contenedor-principal {
      display: flex;
      gap: 40px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      max-width: 100%;
    }

    #numero {
      font-size: 130px;
      font-weight: bold;
      color: #2c3e50;
      margin: 20px 0;
      min-width: 200px;
      text-align: center;
      background: rgba(255, 255, 255, 0.9);
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    #lista-salidos {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
      max-width: 300px;
      margin-top: 20px;
    }

    .numero-salido {
      background-color: #3498db;
      color: white;
      font-weight: bold;
      text-align: center;
      padding: 10px;
      border-radius: 8px;
      font-size: 16px;
    }

    .botones {
      display: flex;
      gap: 15px;
      margin-top: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      padding: 14px 24px;
      font-size: 20px;
      cursor: pointer;
      border: none;
      border-radius: 10px;
      transition: background-color 0.3s, transform 0.2s;
      font-weight: bold;
    }

    #btnSiguiente {
      background-color: #27ae60;
      color: white;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    #btnReiniciar {
      background-color: #e74c3c;
      color: white;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    #btnSiguiente:hover:not(:disabled) {
      background-color: #219653;
    }

    #btnReiniciar:hover {
      background-color: #c0392b;
    }

    button:disabled {
      background-color: #bdc3c7;
      cursor: not-allowed;
      transform: none;
    }

    h2 {
      color: #2c3e50;
      margin-top: 20px;
      font-size: 20px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

  <h1>🎉 El Bingo de Luca 🎉</h1>

  <div class="contenedor-principal">
    <div>
      <div id="numero">¡Presiona "Siguiente"!</div>
      <div class="botones">
        <button id="btnSiguiente" onclick="mostrarSiguiente()">Siguiente</button>
        <button id="btnReiniciar" onclick="reiniciarJuego()">Jugar otra vez</button>
      </div>
    </div>

    <div>
      <h2>Números salidos:</h2>
      <div id="lista-salidos"></div>
    </div>
  </div>

  <script>
    let numeros = [];
    let indiceActual = 0;
    const numeroElement = document.getElementById("numero");
    const listaSalidos = document.getElementById("lista-salidos");
    const btnSiguiente = document.getElementById("btnSiguiente");

    function generarNumerosAleatorios() {
      // Creamos un array del 1 al 60
      const arr = Array.from({length: 60}, (_, i) => i + 1);
      // Mezcla aleatoria (Fisher-Yates)
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function reiniciarJuego() {
      numeros = generarNumerosAleatorios();
      indiceActual = 0;
      numeroElement.textContent = "¡Presiona \"Siguiente\"!";
      listaSalidos.innerHTML = ""; // Limpia la lista
      btnSiguiente.disabled = false;
      btnSiguiente.textContent = "Siguiente";
    }

    function mostrarSiguiente() {
      if (indiceActual < numeros.length) {
        const num = numeros[indiceActual];
        numeroElement.textContent = num;

        const numElement = document.createElement("div");
        numElement.className = "numero-salido";
        numElement.textContent = num;
        listaSalidos.appendChild(numElement);

        indiceActual++;

        if (indiceActual >= numeros.length) {
          btnSiguiente.disabled = true;
          btnSiguiente.textContent = "¡Bingo completo!";
        }
      }
    }

    // Inicializar el juego la primera vez
    reiniciarJuego();
  </script>

</body>
</html>
